<form action="/job/{{ job['id'] }}/apply" method="POST" class="card-clean p-4 text-start" enctype="multipart/form-data">
  <h3 class="serif mb-3">Apply for this position</h3>
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Full Name</label><input required name="full_name" class="form-control"></div>
    <div class="col-md-6"><label class="form-label">Email</label><input required type="email" name="email" class="form-control"></div>
    <div class="col-md-4"><label class="form-label">Country Code</label><input name="country_code" class="form-control" placeholder="+1"></div>
    <div class="col-md-8"><label class="form-label">Phone Number</label><input name="phone_number" class="form-control"></div>
    <div class="col-md-4"><label class="form-label">City</label><input name="city" class="form-control"></div>
    <div class="col-md-4"><label class="form-label">State</label><input name="state" class="form-control"></div>
    <div class="col-md-4"><label class="form-label">Country</label><input name="country" class="form-control"></div>
    <div class="col-12"><label class="form-label">LinkedIn URL</label><input type="url" name="linkedin_url" class="form-control"></div>
    <div class="col-12"><label class="form-label">Education</label><textarea name="education" rows="2" class="form-control"></textarea></div>
    <div class="col-12"><label class="form-label">Work Experience</label><textarea name="work_experience" rows="3" class="form-control"></textarea></div>
    <div class="col-12"><label class="form-label">Cover Letter</label><textarea name="cover_letter" rows="3" class="form-control"></textarea></div>
    <div class="col-12"><label class="form-label">Resume</label><input type="file" name="resume_path" class="form-control"></div>
  </div>
  <button class="btn btn-gold mt-4" type="submit">Submit Application</button>
</form>
