<style>
  .site-header {
    position: sticky;
    top: 0;
    z-index: 90;
    background: rgba(250, 249, 246, 0.97);
    border-bottom: 1px solid #d9d4c8;
    backdrop-filter: blur(8px);
  }

  .top-strip {
    background: #1f2f46;
    color: #f7f4ee;
    font-family: 'Open Sans', system-ui, sans-serif;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .top-strip-inner,
  .nav-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding-inline: 22px;
  }

  .top-strip-inner {
    padding-block: 8px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
  }

  .top-strip a {
    color: #f7f4ee;
    text-decoration: none;
  }

  .top-strip a:hover {
    text-decoration: underline;
  }

  .nav-inner {
    padding-block: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
  }

  .nav-logo img {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid #c8bca5;
  }

  .nav-logo-text {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 21px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #22324a;
  }

  .nav-tagline {
    font-family: 'Open Sans', system-ui, sans-serif;
    font-size: 11px;
    color: #6d5f4a;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 22px;
    font-family: 'Open Sans', system-ui, sans-serif;
    font-size: 13px;
    letter-spacing: 0.02em;
  }

  .nav-links a {
    text-decoration: none;
    color: #22324a;
  }

  .nav-links a:hover {
    color: #7c643e;
  }

  .nav-cta {
    text-decoration: none;
    border: 1px solid #22324a;
    color: #22324a;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-family: 'Open Sans', system-ui, sans-serif;
    font-weight: 700;
  }

  .nav-cta:hover {
    background: #22324a;
    color: #f7f4ee;
  }

  .nav-menu-toggle {
    display: none;
    width: 36px;
    height: 36px;
    border: 1px solid #b8ac95;
    background: #f9f6ef;
    border-radius: 8px;
    font-size: 17px;
    color: #22324a;
    cursor: pointer;
  }

  @media (max-width: 900px) {
    .nav-menu-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .nav-links {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      top: 100%;
      background: #fbf9f3;
      border-bottom: 1px solid #d8d2c4;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 18px;
    }

    .nav-links.nav-open {
      display: flex;
    }
  }

  @media (max-width: 660px) {
    .top-strip {
      display: none;
    }

    .nav-tagline,
    .nav-cta {
      display: none;
    }

    .nav-inner,
    .top-strip-inner {
      padding-inline: 14px;
    }
  }
</style>

<header class="site-header">
  <div class="top-strip">
    <div class="top-strip-inner">
      <span>Legacy Planning · Investment Advisory · Family Office Services</span>
      <a href="mailto:support@fmjcareers.com">support@fmjcareers.com</a>
    </div>
  </div>

  <div class="nav-inner">
    <a href="/" class="nav-logo">
      <img src="{{ url_for('static', filename='logo.jpg') }}" alt="FMJ Capitals logo">
      <div>
        <div class="nav-logo-text">FMJ Capitals</div>
        <div class="nav-tagline">Stewardship for generations</div>
      </div>
    </a>

    <nav class="nav-links">
      <a href="/about">About</a>
      <a href="/solutions">Services</a>
      <a href="/insights">Insights</a>
      <a href="/careers">Careers</a>
      <a href="/contact">Contact</a>
      <a href="/contact" class="nav-cta">Speak with an advisor</a>
    </nav>

    <button class="nav-menu-toggle" type="button" aria-label="Open navigation">☰</button>
  </div>
</header>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const toggle = document.querySelector('.nav-menu-toggle');
    const links = document.querySelector('.nav-links');

    if (toggle && links) {
      toggle.addEventListener('click', function () {
        links.classList.toggle('nav-open');
      });
    }
  });
</script>
